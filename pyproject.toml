[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmark"
version = "0.1.0"
description = "Upload a PDF and a DOCX, annotate math mistakes in red, and download the annotated Word document."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/docmark"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    ".github",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "run.ps1",
    "run.sh",
    ".gitignore",
    ".gitattributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "data", "提交"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["docmark"]
